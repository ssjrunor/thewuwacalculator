  <body>
    <div id="root"></div>
    <main id="boot-fallback" hidden role="alert">
      <div>
        <p>Stopped before the app could start</p>
        <h1>The app could not start.</h1>
        <p id="boot-fallback-message"></p>
        <p>Reload to try again. If this keeps happening, copy the error report.</p>
        <pre id="boot-fallback-stack"></pre>
        <button id="boot-fallback-reload" type="button">Reload page</button>
        <button id="boot-fallback-copy" type="button">Copy report</button>
      </div>
    </main>
    <script>
      ;(() => {
        const root = document.getElementById('root')
        const fallback = document.getElementById('boot-fallback')
        let earlyError = null

        function show(error) {
          if (document.documentElement.dataset.appEntryStarted === 'true' || root?.childElementCount) return
          const message = error instanceof Error ? error.message : String(error)
          const stack = error instanceof Error ? error.stack || message : message
          document.getElementById('boot-fallback-message').textContent = message
          document.getElementById('boot-fallback-stack').textContent = stack
          fallback.hidden = false
          window.dispatchEvent(new Event('app:startup-notice'))
        }

        window.addEventListener('error', (event) => {
          if (document.documentElement.dataset.appEntryStarted === 'true') return
          if (event instanceof ErrorEvent) {
            if (event.filename && new URL(event.filename, location.href).origin !== location.origin) return
            earlyError = event.error || new Error(event.message)
          } else if (event.target instanceof HTMLScriptElement && event.target.dataset.appEntry === 'true') {
            earlyError = new Error('The app entry module could not be loaded.')
          } else {
            return
          }
          setTimeout(() => show(earlyError), 0)
        }, true)

        setTimeout(() => show(earlyError || new Error('The app entry module did not start.')), 5000)
        document.getElementById('boot-fallback-reload').addEventListener('click', () => location.reload())
        document.getElementById('boot-fallback-copy').addEventListener('click', async () => {
          const report = [document.getElementById('boot-fallback-message').textContent,
            location.href, document.getElementById('boot-fallback-stack').textContent].join('\n')
          try { await navigator.clipboard.writeText(report) } catch { /* The message stays selectable. */ }
        })
      })()
    </script>
