name: leaderboard

on:
  push:
    branches: [main]
    paths:
      - services/leaderboard/**
      - src/engine/**
      - src/domain/leaderboard/**
      - public/data/**
      - .github/workflows/leaderboard.yml
  pull_request:
    paths:
      - services/leaderboard/**
      - src/engine/**
      - src/domain/leaderboard/**
      - public/data/**
      - .github/workflows/leaderboard.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: deploy both workers after the checks (migrations first)
        type: boolean
        default: false

concurrency:
  group: leaderboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/leaderboard/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: services/leaderboard
      - name: typecheck the service
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: services/leaderboard
      - name: tests
        run: npx vitest run services/leaderboard/tests src/engine/leaderboard src/domain/leaderboard
      - name: bundles build
        working-directory: services/leaderboard
        run: |
          npx wrangler deploy --dry-run -c wrangler.jsonc --outdir /tmp/lb-api
          npx wrangler deploy --dry-run -c wrangler.scorer.jsonc --outdir /tmp/lb-scorer

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: leaderboard
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/leaderboard/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: services/leaderboard
      - name: migrations
        working-directory: services/leaderboard
        run: npx wrangler d1 migrations apply LB --remote -c wrangler.jsonc
      - name: api worker
        working-directory: services/leaderboard
        run: npx wrangler deploy -c wrangler.jsonc
      - name: scorer worker
        working-directory: services/leaderboard
        run: npx wrangler deploy -c wrangler.scorer.jsonc
